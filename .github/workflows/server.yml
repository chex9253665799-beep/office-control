name: Сервер

# Обслуживание сервера по SSH. Запускает только владелец репозитория (кнопка Run workflow).
# Секреты (Settings → Secrets and variables → Actions):
#   VPS_HOST      — IP сервера
#   VPS_USER      — пользователь (обычно root)
#   VPS_PASSWORD  — пароль SSH (или вместо него VPS_KEY — приватный ключ)
#   VPS_PORT      — порт SSH, если не 22 (необязательно)
#   PANEL_PASS    — пароль для входа в панель офиса (придумай сам)
#   PANEL_PATH    — секретная часть адреса админки (латиница/цифры, 8–64 символа), необязательно
# Логи репозитория открыты — секреты в них GitHub заменяет на ***.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        type: choice
        default: status
        options: [install, status, logs, restart, pcs, reset2fa, rddiag, lastdiag, load, rdkey]
      target:
        description: "Имя ПК (для rddiag)"
        type: string
        default: ""
      script:
        description: "Скрипт PowerShell из репозитория (для rddiag), необязательно"
        type: string
        default: ""

permissions:
  contents: read

concurrency: server

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USR: ${{ secrets.VPS_USER }}
          PASS: ${{ secrets.VPS_PASSWORD }}
          KEY: ${{ secrets.VPS_KEY }}
          PORT: ${{ secrets.VPS_PORT }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          PANEL_PATH: ${{ secrets.PANEL_PATH }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -eu
          [ -n "$HOST" ] || { echo "Нет секрета VPS_HOST"; exit 1; }
          USR=${USR:-root}; PORT=${PORT:-22}
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -p $PORT"
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
            SSH="ssh $OPTS -i $HOME/.ssh/id"
          else
            [ -n "$PASS" ] || { echo "Нет секрета VPS_PASSWORD или VPS_KEY"; exit 1; }
            sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$PASS"
            SSH="sshpass -e ssh $OPTS -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi
          SUDO=""; [ "$USR" = root ] || SUDO="sudo -n"

          case "$ACTION" in
            install)
              [ -n "$PANEL_PASS" ] || { echo "Нет секрета PANEL_PASS (пароль панели)"; exit 1; }
              # пароль панели передаём через stdin, чтобы его не было в командной строке на сервере
              printf '%s\n%s\n' "$PANEL_PASS" "$PANEL_PATH" | $SSH "$USR@$HOST" \
                "read -r P; read -r A; curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/server/install.sh -o /tmp/office-install.sh && $SUDO env OFFICE_PASS=\"\$P\" OFFICE_ADMIN_PATH=\"\$A\" OFFICE_HOST='$HOST' bash /tmp/office-install.sh; rc=\$?; rm -f /tmp/office-install.sh; exit \$rc"
              ;;
            status)
              $SSH "$USR@$HOST" "uname -a; . /etc/os-release && echo \"\$PRETTY_NAME\"; uptime; free -m; df -h / | tail -1;
                for s in office-hbbs office-hbbr office-panel; do printf '%-14s ' \$s; systemctl is-active \$s 2>/dev/null || true; done;
                echo '--- порты'; ss -lntu 2>/dev/null | grep -E ':(2111[5-9]|8443)\b' || echo 'порты панели не слушаются';
                echo '--- работающие службы'; systemctl list-units --type=service --state=running --no-legend --plain | awk '{print \$1}' | tr '\n' ' '; echo;
                echo '--- pm2'; (command -v pm2 >/dev/null && pm2 jlist 2>/dev/null | python3 -c 'import sys,json; [print(p[\"name\"], p[\"pm2_env\"][\"status\"]) for p in json.load(sys.stdin)]') || echo 'pm2 нет';
                echo '--- все открытые порты'; ss -lntup 2>/dev/null | awk 'NR>1{print \$1, \$5, \$7}' | sort -u;
                echo '--- брандмауэр'; (command -v ufw >/dev/null && ufw status) || echo 'ufw нет';
                echo '--- проверка панели'; curl -sk -o /dev/null -w 'HTTP %{http_code}\n' https://127.0.0.1:8443/ || true"
              ;;
            logs)
              $SSH "$USR@$HOST" "$SUDO journalctl -u office-panel -u office-hbbs -u office-hbbr -n 120 --no-pager"
              ;;
            pcs)
              # список ПК без паролей и ключей
              $SSH "$USR@$HOST" "$SUDO python3 -c \"
          import sqlite3, time, json
          c = sqlite3.connect('/opt/office/office.db'); c.row_factory = sqlite3.Row; now = int(time.time())
          for r in c.execute('SELECT * FROM pcs'):
              i = json.loads(r['info'] or '{}')
              print(r['hostname'], '| был', now - (r['last_seen'] or 0), 'с назад | info полей:', len(i), '| программ:', len(json.loads(r['programs'] or '[]')), '| rd_id:', 'есть' if r['rd_id'] else 'нет', '| пароль rd:', 'есть' if r['rd_pass'] else 'нет', '| агент', i.get('agent'))
              try:
                  h = sqlite3.connect('file:/opt/office/rustdesk/db_v2.sqlite3?mode=ro', uri=True)
                  print('    hbbs: всего устройств', h.execute('select count(*) from peer').fetchone()[0], '| этот ПК по guid:', h.execute('select count(*) from peer where uuid=? or uuid=?', (r['guid'].encode(), r['guid'])).fetchone()[0], '| типы uuid:', h.execute('select typeof(uuid), length(uuid) from peer limit 3').fetchall(), '| guid len', len(r['guid'] or ''))
              except Exception as e:
                  print('    hbbs:', e)
              lg = i.get('log') or []
              lg = [lg] if isinstance(lg, str) else lg
              for l in lg[-12:]:
                  l = l.get('value', '') if isinstance(l, dict) else l
                  print('    ', ''.join('#' if ch.isdigit() else ch for ch in str(l)[20:]))
          \" 2>&1"
              ;;
            rddiag)
              $SSH "$USR@$HOST" "cat > /tmp/rd_x.ps1" < "${SCRIPT:-server/tools/rd_diag_default.ps1}" 2>/dev/null || true
              if [ -n "$SCRIPT" ]; then $SSH "$USR@$HOST" "$SUDO python3 - '$TARGET' /tmp/rd_x.ps1; rm -f /tmp/rd_x.ps1" < server/tools/rd_diag.py
              else $SSH "$USR@$HOST" "$SUDO python3 - '$TARGET'" < server/tools/rd_diag.py; fi
              ;;
            load)
              # нагрузка сервера: процессор, память, сеть за 10 секунд, соединения RustDesk
              $SSH "$USR@$HOST" "uptime; free -m | head -2; nproc;
                echo '--- процессы (CPU%, MEM%)'; ps -eo pid,pcpu,pmem,rss,etime,comm --sort=-pcpu | head -12;
                echo '--- службы офиса'; ps -o pid,pcpu,pmem,rss,comm -C hbbs,hbbr,python3 2>/dev/null;
                echo '--- сеть за 10 с'; IF=\$(ip route show default | awk '{print \$5; exit}'); a=\$(awk -v i=\$IF: '\$1==i{print \$2, \$10}' /proc/net/dev); sleep 10; b=\$(awk -v i=\$IF: '\$1==i{print \$2, \$10}' /proc/net/dev);
                set -- \$a \$b; echo \"входящий: \$(( (\$3-\$1)*8/10/1000 )) Кбит/с, исходящий: \$(( (\$4-\$2)*8/10/1000 )) Кбит/с (\$IF)\";
                echo '--- соединения через ретранслятор RustDesk (21117)'; ss -tn state established '( sport = :21117 )' | tail -n +2 | wc -l;
                echo '--- соединения к серверу ID (21116)'; ss -tn state established '( sport = :21116 )' | tail -n +2 | wc -l"
              ;;
            rdkey)
              # открытый ключ сервера RustDesk (не секрет: его получает каждый, кто подключается)
              $SSH "$USR@$HOST" "cat /opt/office/rustdesk/id_ed25519.pub; echo; wc -c < /opt/office/rustdesk/id_ed25519.pub"
              ;;
            lastdiag)
              $SSH "$USR@$HOST" "$SUDO python3 -" < server/tools/task_out.py
              ;;
            reset2fa)
              # потерян телефон: сбросить код из приложения, при следующем входе панель предложит настроить заново
              $SSH "$USR@$HOST" "$SUDO python3 -c \"import json; p='/opt/office/config.json'; c=json.load(open(p)); c.pop('totp', None); json.dump(c, open(p,'w'), indent=2)\" && $SUDO systemctl restart office-panel && echo 'код из приложения сброшен'"
              ;;
            restart)
              $SSH "$USR@$HOST" "$SUDO systemctl restart office-hbbs office-hbbr office-panel && sleep 3 && systemctl is-active office-hbbs office-hbbr office-panel"
              ;;
          esac
